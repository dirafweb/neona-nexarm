# Chatwoot en la misma PC que Nexarm, sin dominio: se abre en http://localhost:3010.
services:
  base: &base
    image: chatwoot/chatwoot:${CHATWOOT_IMAGE_TAG:-latest}
    env_file: .env.local
    volumes:
      - storage_data:/app/storage

  rails:
    <<: *base
    depends_on: [postgres, redis]
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    ports:
      - '3010:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: always

  sidekiq:
    <<: *base
    depends_on: [postgres, redis]
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env.local}

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env.local
    volumes:
      - redis_data:/data

volumes:
  storage_data:
  postgres_data:
  redis_data:
