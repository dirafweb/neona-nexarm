# Chatwoot para Nexarm. Parte del docker-compose.production.yaml oficial de Chatwoot (licencia MIT)
# y agrega Caddy para servirlo con HTTPS en CHATWOOT_DOMAIN.
services:
  base: &base
    image: chatwoot/chatwoot:${CHATWOOT_IMAGE_TAG:-latest}
    env_file: .env
    volumes:
      - storage_data:/app/storage

  rails:
    <<: *base
    depends_on: [postgres, redis]
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    <<: *base
    depends_on: [postgres, redis]
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis_data:/data

  caddy:
    image: caddy:2
    restart: always
    depends_on: [rails]
    ports:
      - '80:80'
      - '443:443'
    command: caddy reverse-proxy --from ${CHATWOOT_DOMAIN:?falta CHATWOOT_DOMAIN en .env} --to rails:3000
    volumes:
      - caddy_data:/data

volumes:
  storage_data:
  postgres_data:
  redis_data:
  caddy_data:
